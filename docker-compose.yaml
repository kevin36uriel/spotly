services:
  catalog-spotly:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: catalog_db_spotly
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  keycloak-db-spotly:
    image: postgres:16-alpine
    container_name: keycloak-db-spotly
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
      POSTGRES_DB: keycloak-db-spotly
    volumes:
      - keycloak_data_spotly:/var/lib/postgresql/data

  keycloak-spotly:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak-spotly
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db-spotly:5432/keycloak-db-spotly
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db-spotly

volumes:
  mysql_data:
  keycloak_data_spotly:


  
